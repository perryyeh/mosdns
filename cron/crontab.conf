# mosdns rule sync - daily at 00:00; my entries in sync.conf are ignored here
0 0 * * * /etc/mosdns/cron/sync-rules.sh >> /etc/mosdns/tmp/sync-rules-$(date +\%F).log 2>&1

# mosdns candidate domain sync - hourly at minute 5, stats only, no reload
5 * * * * /etc/mosdns/cron/sync-candidates.sh >> /etc/mosdns/tmp/sync-candidates-$(date +\%F).log 2>&1

# mosdns candidate promotion - daily at 00:20; suppressed while my mode is 2
20 0 * * * /etc/mosdns/cron/promote-candidates.sh >> /etc/mosdns/tmp/promote-candidates-$(date +\%F).log 2>&1

# mode 0/1 reload once at 00:30; mode 2 leaves the marker for 01:10
30 0 * * * /etc/mosdns/cron/reload-if-needed.sh rules >> /etc/mosdns/tmp/reload-$(date +\%F).log 2>&1

# my mode 2 downloads whitelist, greylist, blacklist, and hosts at 01:00
0 1 * * * /etc/mosdns/cron/sync-my.sh >> /etc/mosdns/tmp/sync-my-$(date +\%F).log 2>&1

# mode 2 reloads once at 01:10 after the my download; other modes do not reload here
10 1 * * * /etc/mosdns/cron/reload-if-needed.sh my >> /etc/mosdns/tmp/reload-$(date +\%F).log 2>&1

# keep only the last 7 days of mosdns cron logs
40 0 * * * find /etc/mosdns/tmp -maxdepth 1 -type f \( -name 'sync-rules-*.log' -o -name 'sync-candidates-*.log' -o -name 'promote-candidates-*.log' -o -name 'sync-my-*.log' -o -name 'reload-*.log' \) -mtime +6 -delete
