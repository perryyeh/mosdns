# mosdns sync config
# Format: target_relative_path | enabled | source_url
# enabled: yes=同步该名单，no=跳过该名单
# target_relative_path 只能是 rule/<文件> 或 my/<文件>。
# 只写文件名的旧行按 rule/<文件> 解释。禁止绝对路径、.. 以及其它目录。
# rule/ 由 sync-rules.sh 处理。my/ 只允许下面 4 个文件，且仅 my 模式 2 由 sync-my.sh 下载。
# 修改来源或某个名单的 yes/no 时改这个文件。以 # 开头的行会忽略。

rule/geoip_cn.txt                  | yes | https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china46.txt
rule/geosite_direct.txt           | yes | https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt
rule/geosite_proxy.txt            | yes | https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/proxy-list.txt
rule/geosite_block.txt            | no  | https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/reject-list.txt
rule/geosite_applecn.txt          | yes | https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/apple-cn.txt
rule/geosite_googlecn.txt         | yes | https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/google-cn.txt
my/whitelist.txt                  | yes | https://raw.githubusercontent.com/perryyeh/mosdns/main/my/whitelist.txt
my/greylist.txt                   | yes | https://raw.githubusercontent.com/perryyeh/mosdns/main/my/greylist.txt
my/blacklist.txt                  | yes | https://raw.githubusercontent.com/perryyeh/mosdns/main/my/blacklist.txt
my/hosts.txt                      | yes | https://raw.githubusercontent.com/perryyeh/mosdns/main/my/hosts.txt
