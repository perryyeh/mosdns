services:
  mosdns:
    image: irinesistiana/mosdns:latest
    container_name: mosdns
    hostname: mosdns
    environment:
      - TZ=CST-8
    restart: always
    networks:
      macvlan:
        ipv4_address: ${ipv4}
        ipv6_address: ${ipv6}
        mac_address: ${macaddress}

    command: ["/bin/sh", "/etc/mosdns/cron/start.sh"]
    volumes:
      - ./:/etc/mosdns/

networks:
  macvlan:
    external: true
    name: ${MACVLAN}